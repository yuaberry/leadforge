name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Smoke (production server)
        run: |
          bun run start &
          sleep 6
          curl -fsS http://localhost:3000/ > /dev/null
          curl -fsS http://localhost:3000/login > /dev/null
          curl -fsS -o /dev/null http://localhost:3000/dashboard

      - name: Secret scan
        run: bash scripts/scan-secrets.sh
