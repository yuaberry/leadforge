<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadForge — Configurar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e17;
      color: #e8ecf4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-app-region: drag;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 400px;
      -webkit-app-region: no-drag;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6, #22d3ee);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      font-size: 36px;
      font-weight: 800;
      color: white;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      color: #64748b;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #1e293b;
      border-radius: 10px;
      background: #121826;
      color: #e8ecf4;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #3b82f6;
    }
    input::placeholder {
      color: #475569;
    }
    button {
      width: 100%;
      margin-top: 1rem;
      padding: 12px 20px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:active {
      opacity: 0.8;
    }
    .error {
      color: #f87171;
      font-size: 0.8rem;
      margin-top: 0.5rem;
      display: none;
    }
    .hint {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #475569;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">LF</div>
    <h1>LeadForge Desktop</h1>
    <p>Digite o endereço do seu servidor LeadForge para começar.</p>

    <input
      type="url"
      id="serverUrl"
      placeholder="https://seu-servidor.com.br"
      autofocus
      spellcheck="false"
    />
    <p class="error" id="error">Digite uma URL válida (começando com http)</p>

    <button onclick="connect()">Conectar</button>

    <p class="hint">
      Este app conecta à sua instância hospedada do LeadForge.
      <br />
      Se ainda não tem um servidor, siga o guia em
      <a href="#" onclick="event.preventDefault(); require('electron').shell.openExternal('https://github.com/yuaberry/leadforge')" style="color:#3b82f6">github.com/yuaberry/leadforge</a>
    </p>
  </div>

  <script>
    const input = document.getElementById('serverUrl');
    const error = document.getElementById('error');

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') connect();
    });

    input.addEventListener('input', () => {
      error.style.display = 'none';
    });

    function connect() {
      const url = input.value.trim();
      if (url && url.startsWith('http')) {
        window.leadforge.setUrl(url);
      } else {
        error.style.display = 'block';
        input.focus();
      }
    }
  </script>
</body>
</html>
